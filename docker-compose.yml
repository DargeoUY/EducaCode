services:
  web:
    build: ./backend
    ports:
      - "80:80"
    env_file:
      - .env
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - ./static:/app/static:ro
      - ./Diseño_Web:/app/static/Diseño_Web:ro
      - ./Algoritmia:/app/static/Algoritmia:ro
      - ./Algoritmo:/app/static/Algoritmo:ro
      - ./Python:/app/static/Python:ro
      - ./pseudocodigo:/app/static/pseudocodigo:ro
      - ./lti-test:/app/static/lti-test:ro
      - ./style:/app/static/style:ro
      - ./ico-img:/app/static/ico-img:ro
      - ./ide:/app/static/ide:ro
      - ./index.html:/app/static/index.html:ro
    networks:
      - app_net

  mariadb:
    image: mariadb:11
    ports:
      - "3306:3306"
    env_file:
      - .env
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_pass_2026}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-materiales1}
      MARIADB_USER: ${MARIADB_USER:-app_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-app_pass_2026}
    volumes:
      - ./db/data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

networks:
  app_net:
    driver: bridge
