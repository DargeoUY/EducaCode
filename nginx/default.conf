server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /php/ {
        rewrite ^/php/(.*)$ /$1 break;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/$1;
        include fastcgi_params;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html$uri;
        include fastcgi_params;
    }

    location = /login {
        alias /usr/share/nginx/html/static/login.html;
    }

    location /admin/ {
        alias /usr/share/nginx/html/static/admin/;
        try_files $uri $uri.html $uri/ /admin/index.html;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /docente/ {
        alias /usr/share/nginx/html/static/docente/;
        try_files $uri $uri/ /docente/index.html;
    }

    location = /docente {
        return 301 /docente/;
    }

    location /ide/ {
        alias /usr/share/nginx/html/ide/;
    }

    location = /ide {
        alias /usr/share/nginx/html/ide/ide.html;
    }

    location /static/ {
        alias /usr/share/nginx/html/static/;
    }

    location = /registro {
        alias /usr/share/nginx/html/static/admin/registrar.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
